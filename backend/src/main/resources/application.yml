spring:
  application:
    name: campusconnect-backend

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"

  autoconfigure:
    # We authenticate against the users table. Never create Spring's generated development user.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    # No defaults on purpose: the app refuses to start until these are provided (see ../.env.example).
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never by Hibernate

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            redirect-uri: "${OAUTH2_REDIRECT_BASE_URL:http://localhost:5173}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
          microsoft:
            client-id: ${MICROSOFT_CLIENT_ID:disabled}
            client-secret: ${MICROSOFT_CLIENT_SECRET:disabled}
            client-name: Microsoft
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH2_REDIRECT_BASE_URL:http://localhost:5173}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/common/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CC_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}   # set true when served over HTTPS

app:
  version: "@project.version@"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    max-failed-logins: ${MAX_FAILED_LOGINS:5}
    lockout-minutes: ${LOCKOUT_MINUTES:15}
    bcrypt-strength: ${BCRYPT_STRENGTH:10}
  bootstrap-admin:
    # Optional. Creates the FIRST Placement Admin at startup only if none exists. Remove the password afterwards.
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${BOOTSTRAP_ADMIN_NAME:Placement Administrator}
  oauth2:
    redirect-base-url: ${OAUTH2_REDIRECT_BASE_URL:http://localhost:5173}
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}